# Parallel disabled — bật ở folder 13 sau khi suite ổn định.
junit.jupiter.execution.parallel.enabled = false

# Tự động convert method name snake_case → readable display.
# "should_throw_when_idAbsent" → "should throw when id absent" trong report.
junit.jupiter.displayname.generator.default = org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores